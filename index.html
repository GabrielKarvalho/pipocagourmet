<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipoca Gourmet</title>
<meta name="description" content="Pipoca Gourmet: aprenda, pratique e monetize seu conhecimento.">
<meta name="theme-color" content="#121110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BF%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--card:#1e1c1a;--line:#2e2a26;--gold:#ffc21a;--txt:#f6f1e8;--mut:#a39b8f;--ok:#2fbf5b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;padding:0 18px 96px;position:relative}
h1,h2,h3{margin:0}.brand{font-style:italic;font-weight:800;color:var(--gold);font-size:1.5rem}.brand b{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:600 1rem Poppins,sans-serif;background:var(--gold);color:#1a1200;cursor:pointer;margin-top:12px}
.btn.alt{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn.g{background:#fff;color:#222}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:1rem Poppins,sans-serif;margin-top:10px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.bar{height:10px;background:#2b2825;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:.85rem}
.ring{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;font-size:2.2rem;font-weight:800}
.ring span{width:124px;height:124px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
.lesson{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:none;color:#1a1200;font-weight:700;cursor:pointer}
.dot.on{background:var(--ok);border-color:var(--ok)}
.lesson a{color:var(--gold);font-size:.8rem;text-decoration:none}
.mod{margin-top:22px;font-weight:600;color:var(--gold)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:#0d0c0b;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:.75rem Poppins,sans-serif;padding:6px;cursor:pointer}
nav button.on{color:var(--gold);font-weight:600}nav span{display:block;font-size:1.3rem}
.err{color:#ff7a6b;font-size:.85rem;min-height:1.2em;margin-top:8px}
.hd{display:flex;justify-content:space-between;align-items:center;padding-top:16px}.hd img{border-radius:6px}
.hi{font-size:1.7rem;margin:18px 0 0}.sec{font-size:1.1rem;margin:22px 0 2px}
.pc{display:flex;gap:14px;align-items:center;background:#fff;color:#1a1200;border-radius:16px;padding:14px}
.pr{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--gold) var(--p),#e9e2d3 0)}
.pr span{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.pm{color:#6b6254;font-size:.85rem}.pb{height:8px;background:#ece6da;border-radius:8px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;background:var(--gold)}
.mr{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;margin-top:10px;color:var(--txt);text-align:left;font:600 .95rem Poppins,sans-serif;cursor:pointer}
.mr img{border-radius:10px;object-fit:cover;flex:none}.mt{flex:1}.mt small,.mt em{display:block;color:var(--mut);font-weight:400;font-style:normal}.mt small{font-size:.78rem}.mt em{font-size:.78rem;margin-top:1px}
.bd{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1a1200;display:grid;place-items:center;font-size:.85rem;flex:none}.bd.ok{background:var(--ok);color:#fff}
nav svg{display:block;margin:0 auto 2px}
.hd img{border-radius:6px}.ic{background:none;border:0;color:var(--txt);font-size:1.9rem;cursor:pointer;padding:0 4px;line-height:1}
.hero{background-size:cover;background-position:right;border-radius:16px;padding:20px 16px;min-height:240px;margin-top:14px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:1.6rem;line-height:1.05;max-width:62%;margin:0}.hero em{color:var(--gold);font-style:normal}.hero p{max-width:60%;font-size:.85rem;margin:8px 0 0}
.go{color:var(--gold);font-size:.9rem;text-decoration:none;font-weight:600}
.pr.dk{width:88px;height:88px;background:conic-gradient(var(--gold) var(--p),#3a352e 0)}.pr.dk span{width:70px;height:70px;background:var(--bg);color:var(--txt);font-size:1.3rem}
.th{position:relative;flex:none;display:block;line-height:0}.th img{border-radius:10px;object-fit:cover}
.pl{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;display:grid;place-items:center;font-style:normal;line-height:1}
.ft{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:10px;color:var(--txt);text-align:left;font:1rem Poppins,sans-serif;cursor:pointer}.ft small{display:block;color:var(--mut);margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;color:var(--txt);font:.8rem Poppins,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}.qa svg{width:30px;height:30px;stroke:var(--gold)}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}.sb input{flex:1;border:0;background:none;margin:0;padding:13px 0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;scrollbar-width:none}.chips button{flex:none;padding:9px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--txt);font:.9rem Poppins,sans-serif;cursor:pointer}.chips .on{background:var(--gold);color:#1a1200;font-weight:700;border-color:var(--gold)}
.mc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;margin-top:12px;cursor:pointer}.mc .mt b{display:block;margin-top:2px}
.okt{color:var(--ok);font-size:.85rem}.as{background:var(--gold);color:#1a1200;border-radius:14px;padding:6px 14px;font-weight:700;font-size:.85rem}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}.mcard img{display:block;width:100%;height:104px;object-fit:cover}.mb{padding:10px}.mb b{display:block;font-size:.88rem;margin-bottom:6px}
.dl{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);background:none;color:var(--gold);cursor:pointer;font-size:.9rem}
.av{width:92px;height:92px;border-radius:50%;background:var(--gold);color:#1a1200;display:grid;place-items:center;font-size:2.6rem;font-weight:800;flex:none;border:4px solid #e6a800}
.badge{display:inline-block;background:var(--gold);color:#1a1200;border-radius:12px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-top:8px}
.pm2{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:1rem Poppins,sans-serif;padding:15px 0;cursor:pointer;text-align:left}.pm2:last-child{border:0}
.bn{height:110px;border-radius:14px;background-size:cover;background-position:right;display:flex;align-items:center;padding:16px;margin-top:14px}.bn i{font-weight:800;max-width:55%;color:#ffd34d;font-size:1.05rem;line-height:1.2}
.bell{position:relative;font-size:1.3rem}.nb{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#ff5a47;color:#fff;font:700 .7rem/18px Poppins,sans-serif;text-align:center;padding:0 4px;font-style:normal}
.nt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;color:var(--txt);text-align:left;font:1rem Poppins,sans-serif;cursor:pointer}.nt small{display:block;color:var(--mut);font-size:.8rem;margin-top:2px;font-weight:400}.nt.nw{border-color:var(--gold)}.dt{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1200;border-radius:12px;padding:10px 16px;opacity:0;transition:opacity .2s;z-index:20;font-size:.9rem;max-width:90%}
</style>
</head>

function doLogin(signup){const e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value;
if(!/^\S+@\S+\.\S+$/.test(e))return err("Digite um e-mail válido.");
if(p.length<6)return err("A senha precisa ter pelo menos 6 caracteres.");
if(!FB_ON){S.user={name:e.split("@")[0],email:e,since:Date.now()};S.tab="home";save();render();return}
err("Entrando…");(signup===true?AUTH.createUserWithEmailAndPassword(e,p):AUTH.signInWithEmailAndPassword(e,p)).catch(x=>err(fbMsg(x)))}

function resetPw(){const e=document.getElementById("em").value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return err("Digite seu e-mail acima e toque em “Esqueci minha senha”.");
AUTH.sendPasswordResetEmail(e).then(()=>err("Enviamos um link para redefinir a senha no seu e-mail.")).catch(x=>err(fbMsg(x)))}

L.push({id:"mat",i:"📄",t:"Materiais em PDF",d:"Guias, receitas e checklists para baixar.",a:"tab",b:"materiais"});
L.push({id:"welcome",i:"🍿",t:"Bem-vindo à Pipoca Gourmet!",d:"Assista às aulas e acompanhe seu progresso.",a:"tab",b:"aulas"});
return L}
const unread=()=>notifs().filter(n=>!(S.seen||[]).includes(n.id)).length;
const bellBtn=()=>{const u=unread();return `<button class="ic bell" aria-label="Notificações${u?": "+u+" novas":""}" onclick="NV=true;render();window.scrollTo(0,0)">🔔${u?`<i class="nb">${u}</i>`:""}</button>`};
const nGo=(id,a,b)=>{S.seen=S.seen||[];if(!S.seen.includes(id))S.seen.push(id);NV=false;
if(a=="play")return play(Number(b));
if(a=="pv"){S.tab="perfil";P=null;M=null;MV=null;PV=b;save();render();window.scrollTo(0,0);return}
go(b)};
function notifView(){const L=notifs(),seen=S.seen||[],u=L.filter(n=>!seen.includes(n.id)).length;
return `<div style="padding-top:18px"><button class="btn alt" style="margin:0;width:auto;padding:8px 14px" onclick="NV=false;render()">← Voltar</button></div><h2 style="margin-top:14px">Notificações</h2><p class="mut">${u?u+(u>1?" novas":" nova"):"Tudo em dia."}</p>
${u?`<button class="btn alt" style="margin-top:0" onclick="S.seen=notifs().map(n=>n.id);save();render()">Marcar todas como lidas</button>`:""}
${L.map(n=>`<button class="nt ${seen.includes(n.id)?"":"nw"}" onclick="nGo('${n.id}','${n.a}','${n.b||""}')"><span style="font-size:1.5rem" aria-hidden="true">${n.i}</span><span style="flex:1"><b>${n.t}</b><small>${n.d}</small></span>${seen.includes(n.id)?"":'<i class="dt" role="img" aria-label="não lida"></i>'}</button>`).join("")}
<p class="mut" style="margin-top:18px;font-size:.8rem">Os avisos aparecem dentro do app, com o contador no sino. Notificações push, que chegam com o app fechado, exigem um app instalado e um servidor.</p>`}
const go=t=>{P=null;M=null;MV=null;PV=null;NV=false;S.tab=t;save();render();window.scrollTo(0,0)};
const play=id=>{P=id;render();window.scrollTo(0,0)};
function player(){const l=LESSONS.find(x=>x.id==P),on=S.done.includes(l.id),prev=LESSONS.find(x=>x.id==l.id-1),nx=LESSONS.find(x=>x.id==l.id+1);
$.innerHTML=`<div style="padding-top:18px"><button class="btn alt" style="margin:0;width:auto;padding:8px 14px" onclick="P=null;render()">← Aulas</button></div>
<div class="mut" style="margin-top:14px">Módulo ${l.mod+1}: ${MODS[l.mod].t}</div><h2>Aula ${l.id}: ${l.title}</h2>
${l.videoId?`<div style="position:relative;padding-top:56.25%;margin-top:12px;border-radius:14px;overflow:hidden;background:#000"><iframe src="https://www.youtube-nocookie.com/embed/${l.videoId}?rel=0" title="${l.title}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><p class="mut">Se o vídeo não carregar, <a style="color:var(--gold)" href="https://www.youtube.com/watch?v=${l.videoId}" target="_blank" rel="noopener">abra no YouTube</a>.</p>`:`<div class="card" style="text-align:center"><div style="font-size:2rem">🎬</div><b>Vídeo desta aula em breve</b><p class="mut">Ainda estamos selecionando o melhor vídeo em português para este tema.</p></div>`}
<button class="btn" onclick="tog(${l.id})">${on?"✓ Aula concluída (desfazer)":"Marcar como concluída"}</button>
<div class="row" style="margin-top:4px">${prev?`<button class="btn alt" onclick="play(${prev.id})">← Anterior</button>`:""}${nx?`<button class="btn alt" onclick="play(${nx.id})">Próxima →</button>`:""}</div>`;}
const tog=id=>{const b=notifs().map(n=>n.id),i=S.done.indexOf(id);i<0?S.done.push(id):S.done.splice(i,1);save();render();const nw=notifs().find(n=>n.ach&&!b.includes(n.id));if(nw)toast("🔔 "+nw.t)};
function render(){if(!AUTH_READY){$.innerHTML='<p class="mut" style="text-align:center;padding-top:40vh">Carregando…</p>';return}if(!S.user)return login();if(P)return player();
const V={home,aulas,materiais,perfil},I={home:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="currentColor"/></svg>`,aulas:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>`,materiais:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,perfil:`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`},L={home:"Home",aulas:"Aulas",materiais:"Materiais",perfil:"Perfil"};
const y=window.scrollY;
$.innerHTML=(NV?notifView():V[S.tab]())+`<nav>${Object.keys(V).map(k=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')"><span>${I[k]}</span>${L[k]}</button>`).join("")}</nav>`;window.scrollTo(0,y);}
const FB_ON=!!(FIREBASE_CONFIG.apiKey&&window.firebase);
let DB=null,AUTH=null,AUTH_READY=!FB_ON,CLOUD_OK=false;
if(FB_ON){firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();DB=firebase.firestore();
AUTH.onAuthStateChanged(async u=>{CLOUD_OK=false;
if(!u){S.user=null;S.done=[];S.seen=[];S.chk=[];AUTH_READY=true;try{localStorage.setItem("pg",JSON.stringify(S))}catch(e){}render();return}
let d=null;try{const snap=await DB.collection(COLECAO).doc(u.uid).get();d=snap.exists?snap.data():{};CLOUD_OK=true}catch(e){d={};toast("Sem conexão com o banco de dados. Seu progresso não será salvo agora.")}
const em=u.email||"";
S.user={uid:u.uid,email:em,name:d.name||u.displayName||(em.split("@")[0]||"aluno"),since:d.since||(u.metadata&&u.metadata.creationTime?Date.parse(u.metadata.creationTime):Date.now())};
S.done=d.done||[];S.seen=d.seen||[];S.chk=d.chk||[];S.tab="home";AUTH_READY=true;
try{localStorage.setItem("pg",JSON.stringify(S))}catch(e){}
if(CLOUD_OK&&!d.name)cloudSave();
render()})}
render();
</script>
